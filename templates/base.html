<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}EcoTrack{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="rings-bg" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">
    <svg class="brand-mark" viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.35"/>
      <circle cx="20" cy="20" r="12.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
      <circle cx="20" cy="20" r="6.5" fill="currentColor"/>
    </svg>
    <span>EcoTrack</span>
  </a>
  <nav class="topnav">
    <a href="{{ url_for('index') }}">Questionnaire</a>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('activities') }}">Daily Activities</a>
    <a href="{{ url_for('learn_more') }}">Learn More</a>
  </nav>
</header>

<main class="page">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>EcoTrack &mdash; measured in kg CO&#8322;e / year</span>
  <a href="{{ url_for('reset') }}">Reset my data</a>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
